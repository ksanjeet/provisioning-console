services:
  sap-wizard:
    build:
      context: .
      # Local checkout of the community.sap_infrastructure collection (with the Apache CloudStack platform),
      # installed into the image. Override with SAP_INFRASTRUCTURE_DIR=/path/to/community.sap_infrastructure
      additional_contexts:
        sap_infrastructure: ${SAP_INFRASTRUCTURE_DIR:-../community.sap_infrastructure}
    ports:
      # Listens on localhost only by default. To reach the console from other machines set
      # SAP_WIZARD_PUBLISH_ADDRESS=0.0.0.0 and enable authentication (SAP_WIZARD_AUTH_USER / SAP_WIZARD_AUTH_PASSWORD).
      - "${SAP_WIZARD_PUBLISH_ADDRESS:-127.0.0.1}:${SAP_WIZARD_PUBLISH_PORT:-5000}:5000"
    environment:
      # Optional; when empty a random key is generated once and stored in the state directory
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:-}"
      SAP_WIZARD_AUTH_USER: "${SAP_WIZARD_AUTH_USER:-}"
      SAP_WIZARD_AUTH_PASSWORD: "${SAP_WIZARD_AUTH_PASSWORD:-}"
      SAP_WIZARD_STATE_DIR: /var/lib/sap-wizard
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    volumes:
      # State: saved provider profiles (credentials, plaintext), generated variables and job logs. Keep it private.
      - ./container-data:/var/lib/sap-wizard
      - ${SAP_MEDIA_DIR:-./media}:/mnt/media:ro
      - ${SAP_SSH_DIR:-./ssh}:/mnt/ssh:ro
      # Override per workstation, e.g. in a .env file next to this compose.yml:
      #   SAP_MEDIA_DIR=/path/to/sap/media
      #   SAP_SSH_DIR=/path/to/.ssh
