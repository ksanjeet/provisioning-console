# cloud-init settings for SLES for SAP CloudStack (KVM) template
datasource_list: [ CloudStack, ConfigDrive, NoCloud, None ]
datasource:
  CloudStack:
    max_wait: 120
    timeout: 50

# Ansible Playbooks for SAP connect as root using the CloudStack SSH key pair
disable_root: false
ssh_pwauth: false
preserve_hostname: false

growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
